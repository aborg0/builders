name: JMH smoke on main

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  jmh-smoke:
    name: JMH smoke (short)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Cache sbt / ivy / coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/plugins.sbt') }}

      - name: Run sbt JMH smoke
        run: |
          set -o pipefail
          # Switch to the jmh subproject, compile and run a short JMH smoke benchmark.
          # Keep iterations small for CI speed: 1 warmup, 3 measurement iterations, 1 fork.
          sbt -v "project jmh" "jmh:compile" "jmh:run -i 3 -wi 1 -f 1 bench.Bench_GeneratedValidated_vs_ManualValidated" | tee jmh-output.txt

      - name: Upload JMH output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-smoke-output
          path: jmh-output.txt

