name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21, 25]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: sbt-cache-${{ matrix.java }}-${{ hashFiles('**/build.sbt') }}

      - name: Set GITHUB env for sbt
        run: |
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> $GITHUB_ENV
          echo "GITHUB_ACTOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Cache coursier and sbt launcher
        uses: actions/cache@v4
        with:
          path: |
            ./.cache/coursier
            ./.sbt-launcher
          key: sbt-launcher-${{ runner.os }}-${{ hashFiles('project/build.properties') }}
          restore-keys: |
            sbt-launcher-${{ runner.os }}-

      - name: Install sbt (via coursier)
        run: |
          # prepare cache dirs
          mkdir -p ./.cache/coursier ./.sbt-launcher
          if [ -x ./.sbt-launcher/sbt ]; then
            echo "Found cached sbt launcher"
            sudo mv ./.sbt-launcher/sbt /usr/local/bin/sbt
          else
            SBT_VERSION=$(sed -n "s/^sbt.version *= *//p" project/build.properties | tr -d '\r')
            if [ -z "$SBT_VERSION" ]; then
              echo "Cannot determine sbt.version from project/build.properties; defaulting to 1.12.5";
              SBT_VERSION=1.12.5
            fi

            echo "Attempting to download official sbt release tarball for version $SBT_VERSION"
            TAR_URL="https://github.com/sbt/sbt/releases/download/v${SBT_VERSION}/sbt-${SBT_VERSION}.tgz"
            if curl -fSL "$TAR_URL" -o sbt.tgz; then
              mkdir -p sbt && tar xzf sbt.tgz -C sbt --strip-components=1
              chmod +x sbt/bin/sbt || true
              sudo mv sbt/bin/sbt /usr/local/bin/sbt
              # keep a cached copy
              mkdir -p ./.sbt-launcher
              cp /usr/local/bin/sbt ./.sbt-launcher/sbt || true
            else
              echo "Tarball download failed, falling back to coursier bootstrap"
              if [ ! -x ./.cache/coursier/cs ]; then
                curl -fLo ./.cache/coursier/cs https://github.com/coursier/coursier/releases/latest/download/cs && chmod +x ./.cache/coursier/cs
              fi
              ./.cache/coursier/cs bootstrap sbt/sbt:$SBT_VERSION -o ./.sbt-launcher/sbt && chmod +x ./.sbt-launcher/sbt || true
              if [ -x ./.sbt-launcher/sbt ]; then
                sudo mv ./.sbt-launcher/sbt /usr/local/bin/sbt || true
                cp /usr/local/bin/sbt ./.sbt-launcher/sbt || true
              else
                echo "Failed to install sbt via both tarball and coursier; aborting"
                exit 1
              fi
            fi
          fi

      - name: Check sbt is installed
        run: |
          sbt --version

      - name: Print sbt launcher path and checksum
        run: |
          set -e
          # Find sbt binary; fallback to common install location
          SBT_BIN=$(which sbt 2>/dev/null || echo /usr/local/bin/sbt)
          echo "sbt path: $SBT_BIN"
          if [ -f "$SBT_BIN" ]; then
            echo "ls -l $SBT_BIN:";
            ls -l "$SBT_BIN" || true
            echo "file output:";
            file "$SBT_BIN" || true
            echo "SHA256:";
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$SBT_BIN"; elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$SBT_BIN"; else echo "no sha256 tool available"; fi
            echo "SHA1:";
            if command -v sha1sum >/dev/null 2>&1; then sha1sum "$SBT_BIN"; elif command -v shasum >/dev/null 2>&1; then shasum -a 1 "$SBT_BIN"; else echo "no sha1 tool available"; fi
          else
            echo "sbt binary not found at $SBT_BIN";
            exit 1
          fi

      - name: Run cross-build and tests for all projects
        run: |
          # Run `sbt +test` to build/test for all crossScalaVersions and subprojects
          sbt +test

      - name: Generate docs (mdoc)
        run: |
          sbt --no-colors docs/mdoc

      - name: Upload generated docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-output-java-25-run-${{ github.run_id }}
          path: builders_docs/target/mdoc
          if-no-files-found: ignore
        if: matrix.java == 25

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set GITHUB env for sbt
        run: |
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> $GITHUB_ENV
          echo "GITHUB_ACTOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Cache coursier and sbt launcher
        uses: actions/cache@v4
        with:
          path: |
            ./.cache/coursier
            ./.sbt-launcher
          key: sbt-launcher-${{ runner.os }}-${{ hashFiles('project/build.properties') }}
          restore-keys: |
            sbt-launcher-${{ runner.os }}-

      - name: Install sbt (via coursier)
        run: |
          mkdir -p ./.cache/coursier ./.sbt-launcher
          if [ -x ./.sbt-launcher/sbt ]; then
            echo "Found cached sbt launcher"
            sudo mv ./.sbt-launcher/sbt /usr/local/bin/sbt
          else
            SBT_VERSION=$(sed -n "s/^sbt.version *= *//p" project/build.properties | tr -d '\r')
            if [ -z "$SBT_VERSION" ]; then
              echo "Cannot determine sbt.version from project/build.properties; defaulting to 1.12.5";
              SBT_VERSION=1.12.5
            fi

            echo "Attempting to download official sbt release tarball for version $SBT_VERSION"
            TAR_URL="https://github.com/sbt/sbt/releases/download/v${SBT_VERSION}/sbt-${SBT_VERSION}.tgz"
            if curl -fSL "$TAR_URL" -o sbt.tgz; then
              mkdir -p sbt && tar xzf sbt.tgz -C sbt --strip-components=1
              chmod +x sbt/bin/sbt || true
              sudo mv sbt/bin/sbt /usr/local/bin/sbt
              mkdir -p ./.sbt-launcher
              cp /usr/local/bin/sbt ./.sbt-launcher/sbt || true
            else
              echo "Tarball download failed, falling back to coursier bootstrap"
              if [ ! -x ./.cache/coursier/cs ]; then
                curl -fLo ./.cache/coursier/cs https://github.com/coursier/coursier/releases/latest/download/cs && chmod +x ./.cache/coursier/cs
              fi
              ./.cache/coursier/cs bootstrap sbt/sbt:$SBT_VERSION -o ./.sbt-launcher/sbt && chmod +x ./.sbt-launcher/sbt || true
              if [ -x ./.sbt-launcher/sbt ]; then
                sudo mv ./.sbt-launcher/sbt /usr/local/bin/sbt || true
                cp /usr/local/bin/sbt ./.sbt-launcher/sbt || true
              else
                echo "Failed to install sbt via both tarball and coursier; aborting"
                exit 1
              fi
            fi
          fi

      - name: Check sbt is installed
        run: |
          sbt --version

      - name: Print sbt launcher path and checksum
        run: |
          set -e
          SBT_BIN=$(which sbt 2>/dev/null || echo /usr/local/bin/sbt)
          echo "sbt path: $SBT_BIN"
          if [ -f "$SBT_BIN" ]; then
            echo "ls -l $SBT_BIN:";
            ls -l "$SBT_BIN" || true
            echo "file output:";
            file "$SBT_BIN" || true
            echo "SHA256:";
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$SBT_BIN"; elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$SBT_BIN"; else echo "no sha256 tool available"; fi
            echo "SHA1:";
            if command -v sha1sum >/dev/null 2>&1; then sha1sum "$SBT_BIN"; elif command -v shasum >/dev/null 2>&1; then shasum -a 1 "$SBT_BIN"; else echo "no sha1 tool available"; fi
          else
            echo "sbt binary not found at $SBT_BIN";
            exit 1
          fi

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sbt publish
